version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: paycore
      POSTGRES_PASSWORD: paycore123
      POSTGRES_DB: paycore
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redispassword123
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://paycore:paycore123@postgres:5432/paycore
      REDIS_URL: redis://:redispassword123@redis:6379/0
      JWT_SECRET_KEY: your-super-secret-key-change-in-production-min-32-chars
    depends_on:
      - postgres
      - redis
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
  redis_data:
